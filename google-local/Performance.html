<!doctype html><html lang="pt-PT"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDP Performance 360</title><style>:root{--green:#526749;--ink:#253329;--muted:#667168;--line:#dbe2d9;--cream:#f6f7f2;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--cream)}*{box-sizing:border-box}body{margin:0}header{padding:22px 5%;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:24px}header img{width:100px;height:55px;object-fit:contain}.brand{display:flex;gap:18px;align-items:center}.brand strong{font-size:20px}.brand small{display:block;color:var(--muted);margin-top:5px}nav{display:flex;flex-wrap:wrap;gap:8px;padding:15px 5%;background:white}a{color:var(--green)}nav a{padding:9px 14px;text-decoration:none;border-radius:6px}nav a.active{background:var(--green);color:white}main{max-width:1250px;margin:35px auto;padding:0 24px}h1{font-size:30px;letter-spacing:-.7px}h2{font-size:21px}p{line-height:1.6}.muted,small{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.grid>.card{margin:0}.score{font-size:46px;font-weight:700;letter-spacing:-1px}.badge{display:inline-block;background:#edf0e7;padding:5px 9px;border-radius:5px;font-size:13px}.pending{background:#fff2d9;color:#825414}label{display:block;font-size:14px;margin:14px 0 6px}input,select,textarea{font:inherit;width:100%;border:1px solid #bbc6b8;border-radius:6px;padding:11px;background:white;color:var(--ink)}textarea{min-height:100px;resize:vertical}input[type=checkbox]{width:auto}button,.button{font:inherit;background:var(--green);color:white;border:0;border-radius:6px;padding:11px 16px;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#e9eee5;color:var(--ink)}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:13px;border-bottom:1px solid var(--line)}.table-wrap{overflow-x:auto}#notice{margin:10px 5%;color:#8d3025}#notice:empty{display:none}.login{max-width:460px;margin:60px auto}.login img{width:130px}.criterion{border-top:1px solid var(--line);padding:12px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.radar{width:100%;max-width:440px;height:auto}.history-bar{height:9px;background:#eef1e9;border-radius:5px}.history-bar span{display:block;background:var(--green);height:100%;border-radius:5px}details{margin:12px 0}pre{white-space:pre-wrap;font-size:13px}fieldset{border:1px solid var(--line);border-radius:8px;margin:18px 0;padding:20px}.checkbox{display:flex;gap:8px;align-items:center}.empty{padding:35px;color:var(--muted);text-align:center}footer{padding:25px 5%;color:var(--muted);font-size:12px}@media(max-width:650px){header{align-items:flex-start;padding:18px}.brand img{width:70px}.brand strong{font-size:17px}main{padding:0 16px}header .actions{margin:0}td,th{padding:9px}}@media print{nav,header .actions,button,.actions,#notice,.no-print{display:none!important}body{background:white}main{max-width:none;margin:0}.card{break-inside:avoid}input,textarea,select{border:0;padding:2px}.grid{display:block}footer{display:none}}
.card{min-width:0;overflow-x:auto}.brand{min-width:0}#session{min-width:0}progress{display:block;width:150px;height:10px;accent-color:var(--green)}@media(max-width:650px){header{flex-direction:column;gap:16px}.brand{width:100%}#session{width:100%;font-size:14px}#session .actions{margin-top:8px}.fields{grid-template-columns:1fr}.grid{grid-template-columns:1fr}main h1{overflow-wrap:anywhere}pre{overflow-wrap:anywhere}}
</style></head><body data-page="bsc.html"><header><div class="brand"><img src="https://montedopasto.github.io/performance-dashboard/logo-monte-do-pasto.png" alt="Monte do Pasto"><div><strong>MDP Performance 360</strong><small>Estratégia e avaliação de desempenho</small></div></div><div id="session"></div></header><nav id="nav" aria-label="Navegação"></nav><div id="notice" role="alert"></div><main id="app"><p>A carregar…</p></main><footer>Monte do Pasto · Avaliações e regras preservadas por versão</footer><script>const $=s=>document.querySelector(s),app=$('#app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={definition:'Em definição',validation:'Em validação',approved:'Aprovada',active:'Ativo',archived:'Arquivado',draft:'Rascunho',evaluation:'Em avaliação',published:'Publicada'};
const badge=s=>`<span class="badge ${['definition','draft','validation'].includes(s)?'pending':''}">${esc(labels[s]||s)}</span>`;
const score=n=>n===null||n===undefined?'Pendente':`${Number(n).toFixed(1)} / 100`;
let me,csrf,catalog,selectedEval,editing;
let microsoftToken='';
async function api(path,method='GET',body) {return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r.ok?resolve(r.data):reject(Error(r.error))).withFailureHandler(()=>reject(Error('Não foi possível ligar ao sistema. Tente novamente.'))).localApi({action:'performance',adminToken:microsoftToken,path,method,body:body||{}}));}
async function companyLogin(){
 const state=crypto.randomUUID()+crypto.randomUUID(),popup=window.open('https://montedopasto.github.io/performance-dashboard/microsoft-local-bridge.html?state='+encodeURIComponent(state),'mdpMicrosoft','width=650,height=740');
 if(!popup)throw Error('Permita a janela de início de sessão Microsoft.');
 await new Promise((resolve,reject)=>{const timer=setTimeout(()=>{window.removeEventListener('message',receive);reject(Error('O início de sessão expirou.'));},180000);function receive(e){if(e.origin!=='https://montedopasto.github.io'||e.source!==popup||!e.data||e.data.state!==state)return;clearTimeout(timer);window.removeEventListener('message',receive);popup.close();if(e.data.error)return reject(Error('Não foi possível entrar.'));microsoftToken=e.data.token;resolve();}window.addEventListener('message',receive);});await main();
}
function companyEntry(){app.innerHTML='<div class="card login"><h1>Estratégia e avaliação</h1><p>Balanced Scorecard e modelos de avaliação da Monte do Pasto.</p><button id="companyLogin">Entrar com Microsoft</button><p><a href="https://montedopasto.github.io/performance-dashboard/">Voltar à app</a></p></div>';$('#companyLogin').onclick=safe(companyLogin);}
function notice(e){$('#notice').textContent=e.message||e;window.scrollTo({top:0,behavior:'smooth'});}
function safe(fn){return async e=>{e?.preventDefault();$('#notice').textContent='';try{await fn(e);}catch(err){notice(err);}};}
const options=(rows,selected='',blank=true)=>`${blank?'<option value="">Selecione…</option>':''}${rows.map(r=>`<option value="${esc(r.id)}" ${r.id===selected?'selected':''}>${esc(r.name)}</option>`).join('')}`;
const field=(label,id,value='',type='text',extra='')=>`<label for="${esc(id)}">${esc(label)}</label><input id="${esc(id)}" type="${type}" value="${esc(value)}" ${extra}>`;
const select=(label,id,rows,value='',blank=true)=>`<label for="${esc(id)}">${esc(label)}</label><select id="${esc(id)}">${options(rows,value,blank)}</select>`;
const area=(label,id,value='')=>`<label for="${esc(id)}">${esc(label)}</label><textarea id="${esc(id)}">${esc(value)}</textarea>`;
const statuses=Object.entries(labels).filter(([id])=>['definition','validation','approved','active','archived'].includes(id)).map(([id,name])=>({id,name}));
function mountNav(){const manager=['ADMIN','CHEFIA'].includes(me.role);const items=[['dashboard.html','O meu desempenho'],...(manager?[['equipa.html','Equipa'],['avaliacao.html','Avaliações']]:[]),...(['ADMIN','CHEFIA','DIRECAO'].includes(me.role)?[['bsc.html','BSC']]:[]),...(me.role==='ADMIN'?[['admin.html','Administração']]:[])];$('#nav').innerHTML=items.map(([file,name])=>`<button class="secondary" data-page="${file}">${name}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=safe(async()=>{document.body.dataset.page=b.dataset.page;await main();}));$('#session').innerHTML=`<span>${esc(me.name)}</span><button class="secondary" id="logout">Sair</button>`;$('#logout').onclick=()=>{microsoftToken='';me=null;$('#nav').replaceChildren();$('#session').replaceChildren();companyEntry();};}
function pinForm(){app.innerHTML=`<div class="card login"><h1>Alterar palavra-passe</h1><p>Use entre 8 e 128 caracteres. A palavra-passe inicial deve ser alterado no primeiro acesso.</p><form id="pinForm">${field('palavra-passe atual','currentPin','','password','required autocomplete="current-password"')}${field('Nova palavra-passe','pin','','password','required minlength="8" maxlength="128" autocomplete="new-password"')}${field('Confirmar palavra-passe','confirmPin','','password','required minlength="8" maxlength="128" autocomplete="new-password"')}<div class="actions"><button>Guardar palavra-passe</button></div></form></div>`;$('#pinForm').onsubmit=safe(async()=>{if($('#pin').value!==$('#confirmPin').value)throw Error('As palavras-passe não coincidem.');const r=await api('/pin','POST',{pin:$('#pin').value,currentPin:$('#currentPin').value});csrf=r.csrf;location.href='/dashboard.html';});}
async function login(){const cfg=await api('/config');app.innerHTML=`<div class="card login"><h1>Bem-vindo</h1><p>Consulte os seus objetivos e avaliações.</p>${cfg.microsoftEnabled?'<a class="button" href="/auth/microsoft">Entrar com Microsoft 365</a>':'<p class="muted">O acesso Microsoft aguarda configuração pelo administrador.</p>'}<p class="muted">ou entre com o seu identificador e palavra-passe</p><form id="loginForm">${field('Identificador do colaborador','username','','text','required autocomplete="username"')}${field('palavra-passe','pin','','password','required minlength="8" maxlength="128" autocomplete="current-password"')}<div class="actions"><button>Entrar</button></div></form><small>Se perdeu o acesso, contacte o administrador para repor a palavra-passe.</small></div>`;$('#loginForm').onsubmit=safe(async()=>{await api('/login','POST',{username:$('#username').value,pin:$('#pin').value});location.href='/dashboard.html';});}
function radar(skills){const ss=skills.filter(s=>s.score!==null);if(ss.length<3)return '<p class="muted">O radar requer pelo menos três competências avaliadas.</p>';const cx=220,cy=210,r=125,n=ss.length;const point=(i,f)=>[cx+Math.sin(i*2*Math.PI/n)*r*f,cy-Math.cos(i*2*Math.PI/n)*r*f];const polygon=f=>ss.map((_,i)=>point(i,f).join(',')).join(' ');return `<svg class="radar" viewBox="0 0 440 430" role="img" aria-label="Radar de competências">${[.25,.5,.75,1].map(f=>`<polygon points="${polygon(f)}" fill="none" stroke="#dbe2d9"/>`).join('')}${ss.map((s,i)=>{const [x,y]=point(i,1),[tx,ty]=point(i,1.35);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#dbe2d9"/><text x="${tx}" y="${ty}" text-anchor="middle" font-size="11">${esc(s.name.slice(0,24))}</text>`;}).join('')}<polygon points="${ss.map((s,i)=>point(i,s.score/100).join(',')).join(' ')}" fill="#52674933" stroke="#526749" stroke-width="2"/></svg>`;}
async function dashboard(employeeId=me.id){const all=await api('/evaluations');const rows=all.filter(e=>e.employeeId===employeeId).sort((a,b)=>b.period.localeCompare(a.period));const emp=catalog.users.find(u=>u.id===employeeId);if(!emp)throw Error('Perfil não disponível.');const published=rows.filter(e=>e.state==='published');const latest=published[0];app.innerHTML=`<h1>${employeeId===me.id?'O meu desempenho':esc(emp.name)}</h1><p class="muted">${esc(catalog.roles.find(r=>r.id===emp.roleId)?.name||'Função por associar')}</p><div class="grid"><div class="card"><h2>Avaliação publicada mais recente</h2><div class="score">${latest?score(latest.calculation.score):'Sem avaliação'}</div><p>${latest?esc(latest.period):'As avaliações ficam disponíveis após publicação.'}</p>${latest?`<button id="latest">Ver avaliação</button>`:''}</div><div class="card"><h2>Competências</h2>${radar(latest?.calculation.skills||[])}</div></div><div class="card"><h2>Histórico por período</h2>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Período</th><th>Estado</th><th>Avaliação</th><th></th></tr></thead><tbody>${rows.map(e=>`<tr><td>${esc(e.period)}</td><td>${badge(e.state)}</td><td>${score(e.calculation.score)}<progress max="100" value="${e.calculation.score||0}" aria-label="Pontuação do período"></progress></td><td><button class="secondary" data-eval="${esc(e.id)}">Consultar</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Ainda sem avaliações disponíveis.</p>'}</div><div id="selfTasks"></div><div id="legacyHistory"></div>`;if(latest)$('#latest').onclick=safe(()=>evaluation(latest.id));document.querySelectorAll('[data-eval]').forEach(b=>b.onclick=safe(()=>evaluation(b.dataset.eval)));
 const legacy=await api('/legacy-history/'+employeeId);$('#legacyHistory').innerHTML=`<div class="card"><h2>Histórico da app anterior</h2><p>Resultados, metas e pesos originais; sem recalcular com as regras atuais.</p>${legacy.evaluations.map(e=>`<details><summary>${esc(e.sourceId)} · ${esc(e.date.slice(0,10)||'Data não registada')}</summary><table><thead><tr><th>Indicador / competência</th><th>Resultado original</th><th>Meta original</th><th>Peso original</th></tr></thead><tbody>${e.kpis.concat(e.competencies).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.value??'Em falta')}</td><td>${esc(c.target??'Não registada')}</td><td>${esc(c.weight??'Em falta')}</td></tr>`).join('')}</tbody></table></details>`).join('')||'<p>Sem registos anteriores disponíveis.</p>'}</div>`;
 if(employeeId===me.id){const tasks=await api('/self-assessments');$('#selfTasks').innerHTML=`<div class="card"><h2>Autoavaliação</h2><p class="muted">Os objetivos atribuídos ficam disponíveis para autoavaliação. Os resultados da chefia só aparecem após publicação.</p>${tasks.filter(t=>['draft','evaluation'].includes(t.state)).map(t=>`<p>${esc(t.period)} ${badge(t.state)} <button class="secondary" data-self="${esc(t.id)}">Preencher</button></p>`).join('')||'<p>Sem autoavaliações disponíveis.</p>'}</div>`;document.querySelectorAll('[data-self]').forEach(b=>b.onclick=safe(async()=>selfForm(tasks.find(t=>t.id===b.dataset.self))));}
}
function resultInputs(template,results={},prefix='r'){return [...template.objectives.map(o=>({...o,criteria:o.criteria})),...((template.skills||[]).length?[{id:'skills',name:'Competências',weight:0,criteria:template.skills}]:[])].map(o=>`<fieldset><legend>${esc(o.name)} ${o.weight?`(${o.weight}%)`:''}</legend>${o.criteria.map(c=>{const r=results[c.id]||{};return `<div class="criterion" data-criterion="${esc(c.id)}"><strong>${esc(c.name)}</strong> ${badge(c.status)}<p class="muted">${esc(c.group)} · ${esc(c.unit||'Unidade por definir')} · Meta: ${esc(c.target??'Por definir')}</p><details><summary>Definição e referência</summary><p>${esc(c.definition||'Definição pendente')}</p><pre>${esc(c.sourceReference||'')}</pre></details><div class="fields"><div>${field('Valor observado',`${prefix}-${c.id}-actual`,r.actual??'','number','min="0" step="any"')}</div><div>${field('Evidência / ligação / referência',`${prefix}-${c.id}-evidence`,r.evidence||'')}</div></div><label class="checkbox"><input type="checkbox" id="${prefix}-${esc(c.id)}-na" ${r.na?'checked':''}> Não aplicável</label>${field('Justificação de N/A',`${prefix}-${c.id}-reason`,r.reason||'')}</div>`;}).join('')}</fieldset>`).join('');}
function readResults(template,prefix='r'){const out={};for(const c of [...template.objectives.flatMap(o=>o.criteria),...(template.skills||[])]){const val=document.getElementById(`${prefix}-${c.id}-actual`).value,na=document.getElementById(`${prefix}-${c.id}-na`).checked;if(val!==''||na)out[c.id]={actual:val!==''?Number(val):null,na,reason:document.getElementById(`${prefix}-${c.id}-reason`).value,evidence:document.getElementById(`${prefix}-${c.id}-evidence`).value};}return out;}
function selfForm(t){app.innerHTML=`<h1>Autoavaliação · ${esc(t.period)}</h1><form id="selfForm">${resultInputs(t.template,t.selfAssessment,'self')}<button>Guardar autoavaliação</button></form>`;$('#selfForm').onsubmit=safe(async()=>{await api(`/evaluations/${t.id}/self`,'POST',{expectedVersion:t.version,results:readResults(t.template,'self')});await dashboard();});}
async function team(){const rows=await api('/evaluations');app.innerHTML=`<h1>A minha equipa</h1><div class="grid">${catalog.users.filter(u=>u.id!==me.id).map(u=>{const latest=rows.filter(e=>e.employeeId===u.id&&e.state==='published').sort((a,b)=>b.period.localeCompare(a.period))[0];return `<div class="card"><h2>${esc(u.name)}</h2><p>${esc(catalog.roles.find(r=>r.id===u.roleId)?.name||'Função por associar')}</p><div class="score">${latest?score(latest.calculation.score):'Sem avaliação'}</div><p>${latest?esc(latest.period):''}</p><a class="button" href="/colaborador.html?id=${encodeURIComponent(u.id)}">Consultar perfil</a></div>`;}).join('')||'<p class="empty">Sem colaboradores atribuídos.</p>'}</div>`;}
async function evaluations(){const rows=await api('/evaluations');app.innerHTML=`<h1>Avaliações individuais</h1><div class="card"><h2>Nova avaliação</h2><form id="newEvaluation"><div class="fields"><div>${select('Colaborador','employee',catalog.users.filter(u=>u.id!==me.id))}</div><div>${select('Modelo ativo','template',catalog.templates.filter(t=>t.status==='active'))}</div><div>${field('Período (AAAA-Q1, AAAA-M01 ou AAAA-A)','period',new Date().getFullYear()+'-Q1','text','required')}</div></div><div class="actions"><button>Criar rascunho</button></div></form><p class="muted">O rascunho guarda a versão atual do modelo e das metas. Os indicadores em definição ficam pendentes.</p></div><div class="card"><h2>Avaliações</h2>${rows.map(e=>`<p>${esc(e.employee.name)} · ${esc(e.period)} ${badge(e.state)} <button class="secondary" data-eval="${esc(e.id)}">Abrir</button></p>`).join('')||'<p>Sem avaliações.</p>'}</div>`;$('#newEvaluation').onsubmit=safe(async()=>{const e=await api('/evaluations','POST',{employeeId:$('#employee').value,templateId:$('#template').value,period:$('#period').value});await evaluation(e.id);});document.querySelectorAll('[data-eval]').forEach(b=>b.onclick=safe(()=>evaluation(b.dataset.eval)));}
async function evaluation(id){const e=await api('/evaluations/'+id);selectedEval=e;const emp=catalog.users.find(u=>u.id===e.employeeId),manager=me.role==='ADMIN'||me.role==='CHEFIA'&&emp?.managerId===me.id;const editable=manager&&['draft','evaluation'].includes(e.state);const next={draft:'evaluation',evaluation:'validation',validation:'approved',approved:'published'}[e.state];app.innerHTML=`<h1>${esc(e.employee.name)} · ${esc(e.period)}</h1><p>${badge(e.state)} · Modelo v${e.template.version} · Avaliação v${e.version}</p><div class="card"><div class="score">${score(e.calculation.score)}</div><p>${e.calculation.complete?'Resultado calculado com as regras do período.':'Avaliação incompleta: existem resultados ou regras pendentes. Os pesos mantêm-se.'}</p>${me.role==='ADMIN'&&['validation','approved'].includes(e.state)?`<form id="reopenForm" class="no-print">${field('Motivo da reabertura','reopenReason','','text','required')}<button class="secondary">Devolver para correção</button></form>`:''}<div class="actions"><button class="secondary" id="print">Imprimir / Guardar PDF</button>${manager&&next?`<button id="transition" ${['approved','published'].includes(next)&&(me.role!=='ADMIN'||!e.calculation.complete)?'disabled':''}>${esc({evaluation:'Iniciar avaliação',validation:'Submeter para validação',approved:'Aprovar',published:'Publicar'}[next])}</button>`:''}</div></div>${editable?`<form id="reviewForm">${resultInputs(e.template,e.results)}${area('Comentários da chefia','comment',e.comment)}${area('Plano de melhoria','improvement',e.improvementPlan)}<label class="checkbox"><input type="checkbox" id="seriousIncident" ${e.seriousIncident?'checked':''}> Incidente grave de segurança, bem-estar ou integridade</label>${area('Revisão explícita do incidente pela gestão','incidentReview',e.incidentReview||'')}<div class="actions"><button>Guardar resultados</button></div></form>`:`<div class="card">${e.calculation.objectives.map(o=>`<h2>${esc(o.name)} · ${score(o.score)}</h2><table><thead><tr><th>Critério</th><th>Meta</th><th>Resultado</th><th>Pontuação</th><th>Evidência</th></tr></thead><tbody>${o.criteria.map(c=>`<tr><td>${esc(c.name)}<small> ${esc(c.definition)}</small></td><td>${esc(c.target??'Pendente')} ${esc(c.unit)}</td><td>${c.result?.na?'N/A · '+esc(c.result.reason):esc(c.result?.actual??'Pendente')}</td><td>${score(c.score)}</td><td>${esc(c.result?.evidence||'')}</td></tr>`).join('')}</tbody></table>`).join('')}<h2>Competências</h2>${radar(e.calculation.skills||[])}<h2>Comentários</h2><p>${esc(e.comment||'Sem comentários.')}</p><h2>Plano de melhoria</h2><p>${esc(e.improvementPlan||'Sem plano registado.')}</p>${e.seriousIncident?`<h2>Revisão de incidente grave</h2><p>${esc(e.incidentReview||'Revisão pendente.')}</p>`:''}</div>`}${manager?`<div class="card"><h2>Autoavaliação do colaborador</h2>${Object.entries(e.selfAssessment||{}).map(([id,r])=>`<p>${esc([...e.template.objectives.flatMap(o=>o.criteria),...(e.template.skills||[])].find(c=>c.id===id)?.name||id)}: ${esc(r.na?'N/A':r.actual)} · ${esc(r.evidence||'')}</p>`).join('')||'<p>Ainda não preenchida.</p>'}</div>`:''}<div class="card"><h2>Tomada de conhecimento</h2>${e.acknowledgement?`<p>Registada em ${esc(new Date(e.acknowledgement.at).toLocaleString('pt-PT',{timeZone:'Europe/Lisbon'}))}</p><p>${esc(e.acknowledgement.comment)}</p>`:e.state==='published'&&me.id===e.employeeId?`<form id="ackForm"><p>A confirmação regista que leu a avaliação. Pode acrescentar observações sobre o resultado.</p>${area('Observações','ackComment')}<div class="actions"><button>Confirmar tomada de conhecimento</button></div></form>`:'<p>Ainda sem confirmação.</p>'}</div>`;
 $('#print').onclick=()=>window.print();if($('#reopenForm'))$('#reopenForm').onsubmit=safe(async()=>{await api(`/evaluations/${id}/reopen`,'POST',{expectedVersion:e.version,reason:$('#reopenReason').value});await evaluation(id);});if(editable)$('#reviewForm').onsubmit=safe(async()=>{await api('/evaluations/'+id,'PUT',{expectedVersion:e.version,results:readResults(e.template),comment:$('#comment').value,improvementPlan:$('#improvement').value,seriousIncident:$('#seriousIncident').checked,incidentReview:$('#incidentReview').value});await evaluation(id);});if($('#transition'))$('#transition').onclick=safe(async()=>{await api(`/evaluations/${id}/transition`,'POST',{expectedVersion:e.version,state:next});await evaluation(id);});if($('#ackForm'))$('#ackForm').onsubmit=safe(async()=>{await api(`/evaluations/${id}/acknowledge`,'POST',{expectedVersion:e.version,comment:$('#ackComment').value});await evaluation(id);});
}
async function bsc(){const results=await api('/bsc-results');const perspectiveNames={F:'Financeira',C:'Clientes',P:'Processos internos',O:'Capacidade organizacional'};app.innerHTML=`<h1>Balanced Scorecard</h1><p class="muted">Estratégia corporativa e contributo dos departamentos. Metas de origem permanecem em definição até validação.</p><div class="card">${select('Âmbito','scope',[{id:'corporate',name:'Corporativo'},...catalog.departments.map(d=>({id:d.id,name:d.name}))],'corporate',false)}</div><div id="scorecard"></div>`;const render=()=>{const scope=$('#scope').value;const obs=catalog.objectives.filter(o=>scope==='corporate'?o.scope==='corporate':o.scope==='department'&&o.departmentId===scope);$('#scorecard').innerHTML=obs.map(o=>`<div class="card"><small>${esc(perspectiveNames[o.perspective]||catalog.objectives.find(p=>p.id===o.parentId)?.name||'Departamento')}</small><h2>${esc(o.name)} ${badge(o.status)}</h2><p>${esc(o.reference||o.definition||'')}</p>${o.parentId?`<p>Alinhamento: ${esc(catalog.objectives.find(x=>x.id===o.parentId)?.name||o.parentId)}</p>`:''}${catalog.kpis.filter(k=>k.objectiveId===o.id).map(k=>`<div class="criterion"><strong>${esc(k.name)}</strong> ${badge(k.status)}<p>Meta: ${esc(k.target??'Por definir')} ${esc(k.unit)} · ${esc(k.definition)}</p>${results.filter(r=>r.kpi.id===k.id).sort((a,b)=>b.period.localeCompare(a.period)).map(r=>`<p>${esc(r.period)}: ${r.result.na?'N/A · '+esc(r.result.reason):esc(r.result.actual)} ${esc(r.kpi.unit)} · Meta do período: ${esc(r.kpi.target??'Pendente')} · v${r.kpi.version}</p>`).join('')||'<p class="muted">Sem resultados registados.</p>'}${k.status==='active'&&me.role!=='DIRECAO'&&(me.role!=='CHEFIA'||o.scope==='department'&&o.departmentId===me.departmentId)?`<button class="secondary" data-kpi="${esc(k.id)}">Registar resultado</button>`:''}</div>`).join('')||'<p class="muted">Indicadores por configurar a partir da referência aprovada.</p>'}</div>`).join('')||'<p class="empty">Sem objetivos neste âmbito. O administrador pode criar objetivos departamentais alinhados com a estratégia.</p>';document.querySelectorAll('[data-kpi]').forEach(btn=>btn.onclick=()=>bscResult(catalog.kpis.find(k=>k.id===btn.dataset.kpi),results));};$('#scope').onchange=render;render();}
function bscResult(k,results){app.innerHTML=`<h1>${esc(k.name)}</h1><form id="bscResult" class="card">${field('Período','period',new Date().getFullYear()+'-Q1','text','required')}${field('Valor observado','actual','','number','step="any" min="0"')}<label class="checkbox"><input type="checkbox" id="na"> Não aplicável</label>${field('Justificação','reason')}${field('Evidência','evidence')}<div class="actions"><button>Guardar resultado</button></div></form>`;$('#bscResult').onsubmit=safe(async()=>{const period=$('#period').value,old=results.find(r=>r.id===k.id+':'+period);await api('/bsc-results','POST',{kpiId:k.id,period,expectedVersion:old?.version,result:{actual:$('#actual').value===''?null:Number($('#actual').value),na:$('#na').checked,reason:$('#reason').value,evidence:$('#evidence').value}});await bsc();});}
const kindNames={users:'Colaboradores',departments:'Departamentos',roles:'Funções',objectives:'Objetivos BSC',kpis:'Indicadores BSC',templates:'Modelos de avaliação'};
async function admin(){catalog=await api('/catalog');app.innerHTML=`<h1>Administração</h1><button id="syncLocal" class="secondary">Sincronizar perfis sem Microsoft</button><p>Configure funções, responsáveis, modelos e metas. Cada alteração cria uma nova versão.</p><div class="card">${select('Configuração','kind',Object.entries(kindNames).map(([id,name])=>({id,name})),'users',false)}<div class="actions"><button id="newEntity">Criar</button><button class="secondary" id="audit">Ver auditoria</button></div><div id="entities"></div></div><div id="editor"></div>`;const render=()=>{const kind=$('#kind').value;$('#entities').innerHTML=`<table><thead><tr><th>Nome</th><th>Estado / Perfil</th><th>Versão</th><th></th></tr></thead><tbody>${catalog[kind].map(x=>`<tr><td>${esc(x.name)}</td><td>${x.status?badge(x.status):esc(x.role||'')}</td><td>${x.version||'—'}</td><td><button class="secondary" data-edit="${esc(x.id)}">Editar</button> <button class="secondary" data-versions="${esc(x.id)}">Versões</button></td></tr>`).join('')}</tbody></table>`;document.querySelectorAll('[data-edit]').forEach(btn=>btn.onclick=()=>entityEditor(kind,catalog[kind].find(x=>x.id===btn.dataset.edit)));document.querySelectorAll('[data-versions]').forEach(btn=>btn.onclick=safe(async()=>{const vs=await api(`/versions/${kind}/${btn.dataset.versions}`);$('#editor').innerHTML=`<div class="card"><h2>Versões preservadas</h2>${vs.map(v=>`<details><summary>v${v.version} · ${esc(v.updatedAt)}</summary><pre>${esc(JSON.stringify(v,null,2))}</pre></details>`).join('')}</div>`;}));};$('#syncLocal').onclick=safe(async()=>{await api('/sync-local','POST',{});await admin();});$('#kind').onchange=render;$('#newEntity').onclick=()=>entityEditor($('#kind').value);$('#audit').onclick=safe(async()=>{const rows=await api('/audit');$('#editor').innerHTML=`<div class="card"><h2>Auditoria</h2><table><thead><tr><th>Data</th><th>Autor</th><th>Operação</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.at)}</td><td>${esc(catalog.users.find(u=>u.id===r.actor)?.name||r.actor)}</td><td>${esc(r.action)} · ${esc(r.entity)}</td></tr>`).join('')}</tbody></table></div>`;});render();}
function entityEditor(kind,old={}){if(kind==='templates')return templateEditor(old);$('#editor').innerHTML=`<div class="card"><h2>${old.id?'Editar':'Criar'} · ${kindNames[kind]}</h2><form id="entityForm">${field('Nome','name',old.name||'','text','required')}${kind==='users'?`${field('Identificador de perfil','username',old.username||'','text','required')}${field('Número de colaborador','number',old.number||'','text','required')}${field('Perfil Microsoft existente','role',old.role||'COLABORADOR','text','readonly')}${select('Função','roleId',catalog.roles,old.roleId)}${select('Departamento','departmentId',catalog.departments,old.departmentId)}${select('Chefia','managerId',catalog.users.filter(u=>['ADMIN','CHEFIA'].includes(u.role)&&u.id!==old.id),old.managerId)}<label class="checkbox"><input type="checkbox" id="active" ${old.active!==false?'checked':''}> Acesso ativo</label><p class="muted">Os acessos sem Microsoft são criados no portal correspondente. Este formulário configura o perfil de avaliação.</p>`:''}${['objectives','kpis'].includes(kind)?select('Estado','status',statuses,old.status||'definition',false):''}${kind==='objectives'?`${select('Âmbito','objectiveScope',[{id:'corporate',name:'Corporativo'},{id:'department',name:'Departamental'}],old.scope||'department',false)}${select('Perspetiva','perspective',[{id:'F',name:'Financeira'},{id:'C',name:'Clientes'},{id:'P',name:'Processos internos'},{id:'O',name:'Capacidade organizacional'}],old.perspective||'P',false)}${select('Departamento','departmentId',catalog.departments,old.departmentId)}${select('Objetivo corporativo associado','parentId',catalog.objectives.filter(o=>o.scope==='corporate'),old.parentId)}${area('Definição','definition',old.definition||'')}${area('Referência / fonte','reference',old.reference||'')}`:''}${kind==='kpis'?`${select('Objetivo BSC','objectiveId',catalog.objectives,old.objectiveId)}${area('Definição, âmbito, período e denominador','definition',old.definition||'')}${field('Unidade','unit',old.unit||'')}${select('Regra de cálculo','direction',[{id:'higher',name:'Quanto maior, melhor'},{id:'lower',name:'Quanto menor, melhor'},{id:'zero',name:'Zero ocorrências (binário)'},{id:'manual',name:'Pontuação direta 0–100'}],old.direction||'higher',false)}${field('Meta numérica','target',old.target??'','number','step="any" min="0"')}${area('Referência de origem','reference',old.reference||'')}`:''}<div class="actions"><button>Guardar nova versão</button></div></form></div>`;$('#entityForm').onsubmit=safe(async()=>{const b={...old,name:$('#name').value};if(kind==='users')for(const key of ['username','number','role','roleId','departmentId','managerId'])b[key]=$('#'+key).value;if(kind==='users')b.active=$('#active').checked;if(['objectives','kpis'].includes(kind))b.status=$('#status').value;if(kind==='objectives'){b.scope=$('#objectiveScope').value;for(const key of ['perspective','departmentId','parentId','definition','reference'])b[key]=$('#'+key).value;}if(kind==='kpis'){for(const key of ['objectiveId','definition','unit','direction','reference'])b[key]=$('#'+key).value;b.target=$('#target').value===''?null:Number($('#target').value);}if(old.id)b.expectedVersion=old.version;const saved=await api('/catalog/'+kind+(old.id?'/'+old.id:''),old.id?'PUT':'POST',b);await admin();});}
function newCriterion(group='lead'){return {id:crypto.randomUUID(),name:'',group,weight:1,status:'definition',direction:'higher',target:null,unit:'',definition:''};}
function templateEditor(old={}){editing=structuredClone(old.id?old:{name:'',roleId:'',status:'definition',method:'leadlag',leadWeight:40,objectives:[{id:crypto.randomUUID(),name:'',weight:100,strategicIds:[],criteria:[newCriterion('lead'),newCriterion('lag')]}],skills:[]});renderTemplate();}
function renderTemplate(){const t=editing;$('#editor').innerHTML=`<form id="templateForm" class="card"><h2>Modelo configurável ${t.version?'· v'+t.version:''}</h2><p>Preencha apenas critérios aprovados pela empresa. As regras em definição ficam pendentes. Alterar este modelo não modifica avaliações já criadas.</p><div class="fields"><div>${field('Nome','t-name',t.name,'text','required')}</div><div>${select('Função','t-role',catalog.roles,t.roleId)}</div><div>${select('Estado do modelo','t-status',statuses,t.status,false)}</div></div><div class="fields"><div>${select('Método','t-method',[{id:'leadlag',name:'Objetivos com Lead / Lag'},{id:'legacy',name:'Média ponderada de pontuações'}],t.method,false)}</div><div>${field('Peso Lead (%) — restante peso para Lag','t-lead',t.leadWeight??40,'number','min="0" max="100" step="any"')}</div></div>${t.source?`<details><summary>Fonte e notas do PowerPoint</summary><pre>${esc(t.source.file)} · Slide ${esc(t.source.slide)}\n${esc(t.source.notes)}</pre></details>`:''}${t.objectives.map((o,i)=>`<fieldset><legend>Objetivo ${i+1}</legend><div class="fields"><div>${field('Objetivo',`o-${i}-name`,o.name,'text','required')}</div><div>${field('Peso (%)',`o-${i}-weight`,o.weight,'number','min="0" max="100" step="any"')}</div><div>${field('Códigos BSC associados, separados por vírgulas',`o-${i}-strategic`,(o.strategicIds||[]).join(', '))}</div></div>${o.sourceText?`<details><summary>Texto original do objetivo</summary><pre>${esc(o.sourceText)}</pre></details>`:''}${o.criteria.map((c,j)=>criterionEditor(c,`${i}-${j}`)).join('')}<div class="actions"><button type="button" data-add-criterion="${i}" class="secondary">Adicionar critério</button><button type="button" data-remove-objective="${i}" class="secondary">Remover objetivo</button></div></fieldset>`).join('')}<fieldset><legend>Competências (radar, separadas da pontuação global)</legend>${(t.skills||[]).map((c,j)=>criterionEditor(c,`skill-${j}`)).join('')}<button type="button" id="addSkill" class="secondary">Adicionar competência</button></fieldset><div class="actions"><button type="button" id="addObjective" class="secondary">Adicionar objetivo</button><button>Guardar nova versão</button></div></form>`;
 $('#templateForm').onsubmit=safe(async()=>{readTemplate();await api('/catalog/templates'+(t.id?'/'+t.id:''),t.id?'PUT':'POST',{...editing,expectedVersion:t.version});await admin();});$('#addObjective').onclick=()=>{readTemplate();editing.objectives.push({id:crypto.randomUUID(),name:'',weight:0,strategicIds:[],criteria:[newCriterion('lead'),newCriterion('lag')]});renderTemplate();};$('#addSkill').onclick=()=>{readTemplate();(editing.skills||=[]).push({...newCriterion('skill'),direction:'manual',unit:'pontos',target:100});renderTemplate();};document.querySelectorAll('[data-add-criterion]').forEach(btn=>btn.onclick=()=>{readTemplate();editing.objectives[+btn.dataset.addCriterion].criteria.push(newCriterion());renderTemplate();});document.querySelectorAll('[data-remove-objective]').forEach(btn=>btn.onclick=()=>{readTemplate();editing.objectives.splice(+btn.dataset.removeObjective,1);renderTemplate();});document.querySelectorAll('[data-remove-criterion]').forEach(btn=>btn.onclick=()=>{readTemplate();const [i,j]=btn.dataset.removeCriterion.split('-');if(i==='skill')editing.skills.splice(+j,1);else editing.objectives[+i].criteria.splice(+j,1);renderTemplate();});}
function criterionEditor(c,id){return `<div class="criterion"><div class="fields"><div>${field('Critério',`c-${id}-name`,c.name,'text','required')}</div><div>${select('Grupo',`c-${id}-group`,['lead','lag','result','skill'].map(id=>({id,name:id})),c.group,false)}</div><div>${select('Estado',`c-${id}-status`,statuses,c.status,false)}</div><div>${field('Peso relativo dentro do grupo',`c-${id}-weight`,c.weight,'number','min="0" step="any"')}</div></div><div class="fields"><div>${select('Regra',`c-${id}-direction`,[{id:'higher',name:'Quanto maior, melhor'},{id:'lower',name:'Quanto menor, melhor'},{id:'zero',name:'Zero ocorrências'},{id:'manual',name:'Pontuação 0–100'}],c.direction,false)}</div><div>${field('Meta',`c-${id}-target`,c.target??'','number','min="0" step="any"')}</div><div>${field('Unidade',`c-${id}-unit`,c.unit)}</div></div>${area('Definição, âmbito, período e denominador',`c-${id}-definition`,c.definition)}${c.confirmation?`<p>${esc(c.confirmation)}</p>`:''}<button type="button" class="secondary" data-remove-criterion="${id}">Remover critério</button></div>`;}
function readTemplate(){const t=editing;t.name=$('#t-name').value;t.roleId=$('#t-role').value;t.status=$('#t-status').value;t.method=$('#t-method').value;t.leadWeight=Number($('#t-lead').value);const read=(c,id)=>{for(const key of ['name','group','status','direction','unit','definition'])c[key]=document.getElementById(`c-${id}-${key}`).value;c.weight=Number(document.getElementById(`c-${id}-weight`).value);const val=document.getElementById(`c-${id}-target`).value;c.target=val===''?null:Number(val);};t.objectives.forEach((o,i)=>{o.name=$(`#o-${i}-name`).value;o.weight=Number($(`#o-${i}-weight`).value);o.strategicIds=$(`#o-${i}-strategic`).value.split(',').map(s=>s.trim()).filter(Boolean);o.criteria.forEach((c,j)=>read(c,`${i}-${j}`));});(t.skills||[]).forEach((c,j)=>read(c,`skill-${j}`));}
async function main(){
 if(!microsoftToken)return companyEntry();
 const session=await api('/me');me={...session.user,hasLocalPin:false};csrf=session.csrf;
 mountNav();
 if(!session.initialized){app.innerHTML=`<div class="card"><h1>MDP Performance 360</h1><p>Os módulos de estratégia e avaliação ainda não foram inicializados.</p>${me.role==='ADMIN'?'<p>A preparação importa as propostas dos dois PowerPoints em definição e associa os colaboradores já existentes. Não ativa indicadores nem publica avaliações.</p><button id="setup">Preparar módulos</button>':''}</div>`;if($('#setup'))$('#setup').onclick=safe(async()=>{await api('/setup','POST',{});await main();});return;}
 catalog=await api('/catalog');
 const page=document.body.dataset.page||'bsc.html';
 if(page==='dashboard.html')return dashboard();
 if(page==='colaborador.html')return dashboard(new URLSearchParams(location.search).get('id')||me.id);
 if(page==='equipa.html')return team();
 if(page==='avaliacao.html')return evaluations();
 if(page==='bsc.html')return bsc();
 if(page==='admin.html'){if(me.role!=='ADMIN')throw Error('Acesso reservado ao administrador.');return admin();}
}
safe(main)();
</script></body></html>
